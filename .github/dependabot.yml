version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /apps/pr-inbox
    schedule:
      interval: weekly
    ignore:
      # 0.5.x-0.8.x are a 2014 Heroku app.json tool that once owned the "apps" npm name.
      - dependency-name: apps
        versions: ["0.5.x", "0.7.x", "0.8.x"]
  - package-ecosystem: npm
    directory: /apps/review-worker
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
